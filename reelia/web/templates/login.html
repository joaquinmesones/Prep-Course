{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block clase_main %}centrado{% endblock %}
{% block contenido %}
<div class="tarjeta login">
  <img class="logo-cliente" src="{{ url_for('static', filename='marca/logo_defecto.png') }}" alt="Lucio López Fleming · Buenos Negocios">
  <div class="logo grande"><span class="punto"></span>VideoLabs</div>
  <p class="sub">Soluciones inmobiliarias</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email<input type="email" name="email" required autofocus autocomplete="username"></label>
    <label>Contraseña<input type="password" name="clave" required autocomplete="current-password"></label>
    <button class="btn ancho">Ingresar</button>
  </form>
  <p class="nota">¿No tenés cuenta? Pedísela al administrador.</p>
  <p class="firma">Desarrollado por Joaquín Mesones</p>
</div>
{% endblock %}
