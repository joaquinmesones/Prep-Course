{% extends "base.html" %}
{% block titulo %}Mi cuenta{% endblock %}
{% block contenido %}
<h1>Mi cuenta</h1>
<div class="tarjeta angosta">
  <p><strong>{{ usuario.nombre or usuario.email }}</strong><br><span class="nota">{{ usuario.email }}</span></p>
  {% if voz_disponible %}<p><a class="btn secundario-neutro" href="{{ url_for('mi_voz') }}">🎙 Mi voz (clonar mi voz para los videos)</a></p>{% endif %}
  <h2>Cambiar contraseña</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Contraseña actual<input type="password" name="actual" required autocomplete="current-password"></label>
    <label>Nueva contraseña<input type="password" name="nueva" minlength="8" required autocomplete="new-password"></label>
    <button class="btn">Guardar</button>
  </form>
</div>
{% endblock %}
